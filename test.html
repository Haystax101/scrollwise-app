<!DOCTYPE html>
<html>
  <head>
    <style>
      body { margin: 0; background: #050510; overflow: hidden; font-family: sans-serif; }
      canvas { display: block; }
      #label {
        position: absolute;
        bottom: 20px;
        left: 20px;
        color: #fff;
        letter-spacing: 2px;
        font-size: 12px;
        text-transform: uppercase;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <div id="label">Geopolitical Stability Monitor: Greenland</div>
    <canvas id="c"></canvas>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");
      let width, height;

      const COLORS = {
        bg: "#050510",
        greenland: "#00f2ff", // Cyan Ice
        threat: "#ff0044",    // Trump Red
        ally: "#ffcc00",      // UK/Denmark Gold
        particle: "#ffffff"
      };

      let threatLevel = 0;
      let shieldStrength = 0;
      let particles = [];

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = 300; // Fixed height for mobile WebView (not window.innerHeight!)
      }
      window.addEventListener("resize", resize);
      resize();

      class Greenland {
        constructor() {
          this.x = width / 2;
          this.y = height / 2;
          this.radius = 80;
          this.rotation = 0;
          this.glitch = 0;
        }
        draw(ctx) {
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate(this.rotation);
          
          // Outer Glow
          const grad = ctx.createRadialGradient(0,0,0,0,0,this.radius * 1.5);
          grad.addColorStop(0, COLORS.greenland + "33");
          grad.addColorStop(1, "transparent");
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(0,0, this.radius * 2, 0, Math.PI*2);
          ctx.fill();

          // Crystalline Shape
          ctx.strokeStyle = COLORS.greenland;
          ctx.lineWidth = 2;
          ctx.beginPath();
          for(let i=0; i<6; i++) {
            let angle = (i/6) * Math.PI * 2;
            let r = this.radius + (Math.random() * this.glitch);
            let tx = Math.cos(angle) * r;
            let ty = Math.sin(angle) * r;
            if(i===0) ctx.moveTo(tx, ty);
            else ctx.lineTo(tx, ty);
          }
          ctx.closePath();
          ctx.stroke();
          
          // Core
          ctx.fillStyle = COLORS.greenland + "11";
          ctx.fill();
          ctx.restore();
        }
      }

      class ThreatWave {
        constructor() {
          this.reset();
        }
        reset() {
          this.r = width > height ? width : height;
          this.active = false;
        }
        update() {
          if(this.active) {
            this.r -= 5;
            if(this.r < 100) this.reset();
          }
        }
        draw(ctx) {
          if(!this.active) return;
          ctx.beginPath();
          ctx.arc(width/2, height/2, this.r, 0, Math.PI*2);
          ctx.strokeStyle = COLORS.threat + "44";
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      }

      const island = new Greenland();
      const wave = new ThreatWave();

      function init() {
        const tl = gsap.timeline({repeat: -1});

        // Phase 1: Stability
        tl.to(island, { duration: 2, rotation: Math.PI * 0.5, ease: "none" });

        // Phase 2: Threat (Trump intervention)
        tl.addLabel("threatStart");
        tl.to(island, { glitch: 15, duration: 0.2, repeat: 5, yoyo: true });
        tl.call(() => { wave.active = true; threatLevel = 1; });
        tl.to(island, { radius: 70, duration: 1, ease: "elastic" });

        // Phase 3: Alliance Shield (Starmer intervention)
        tl.addLabel("defense", "+=1");
        tl.to({}, { duration: 2, onUpdate: function() {
            shieldStrength = this.progress();
        }});
        tl.call(() => { wave.active = false; threatLevel = 0; });
        tl.to(island, { glitch: 0, radius: 80, duration: 1 });
        
        // Reset for loop
        tl.to({}, {duration: 2}); // Pause
        tl.call(() => { shieldStrength = 0; });

        animate();
      }

      function drawShield(ctx) {
        if(shieldStrength <= 0) return;
        ctx.save();
        ctx.translate(width/2, height/2);
        ctx.beginPath();
        ctx.arc(0, 0, 150, 0, Math.PI * 2 * shieldStrength);
        ctx.strokeStyle = COLORS.ally;
        ctx.lineWidth = 4;
        ctx.setLineDash([10, 15]);
        ctx.stroke();
        
        // Label Text
        ctx.fillStyle = COLORS.ally;
        ctx.font = "bold 10px sans-serif";
        ctx.fillText("STARMER / DENMARK DEFENSE BLOCK", 160, 0);
        ctx.restore();
      }

      function animate() {
        ctx.fillStyle = COLORS.bg;
        ctx.fillRect(0, 0, width, height);

        // Draw Background Particles
        ctx.fillStyle = "#ffffff11";
        for(let i=0; i<20; i++) {
            ctx.beginPath();
            ctx.arc(Math.random()*width, Math.random()*height, 1, 0, Math.PI*2);
            ctx.fill();
        }

        wave.update();
        wave.draw(ctx);
        island.draw(ctx);
        drawShield(ctx);

        if(threatLevel > 0) {
            ctx.fillStyle = COLORS.threat;
            ctx.font = "bold 14px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("ANNEXATION PRESSURE DETECTED", width/2, height/2 + 200);
        }

        requestAnimationFrame(animate);
      }

      init();
    </script>
  </body>
</html>
